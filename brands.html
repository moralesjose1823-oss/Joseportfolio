<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="0; url=index.html#work" http-equiv="refresh"/><title>Jose Morales</title></head><body><a href="index.html#work">Open portfolio</a><div aria-hidden="true" aria-label="Kaiser Permanente original 17-slide pitch deck" aria-modal="true" class="deck-overlay" id="kaiser-deck" role="dialog"><div class="deck-top"><span>KAISER PERMANENTE × OREGON ACCELERATOR · ORIGINAL PITCH DECK</span><button aria-label="Close pitch deck" class="deck-close">CLOSE ×</button></div><div class="deck-image-wrap"><img alt="Kaiser Permanente pitch deck slide 1 of 17" class="deck-image" src="assets/kaiser-deck/01.jpg"/></div><div class="deck-bottom"><button class="deck-back">PREVIOUS</button><span class="deck-index">01 / 17</span><button class="deck-forward">NEXT</button></div></div><script>
(function(){const overlay=document.getElementById('kaiser-deck'),open=document.getElementById('deck-open-link');if(!overlay||!open)return;let idx=0;const img=overlay.querySelector('.deck-image'),count=overlay.querySelector('.deck-index');const slides=window.KAISER_SLIDES||Array.from({length:17},(_,i)=>'assets/kaiser-deck/'+String(i+1).padStart(2,'0')+'.jpg');function show(n){idx=(n+17)%17;img.src=slides[idx];img.alt='Kaiser Permanente original pitch deck slide '+(idx+1)+' of 17';count.textContent=String(idx+1).padStart(2,'0')+' / 17'}function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.classList.remove('deck-open-body');if(location.hash==='#kaiser-deck')history.replaceState(null,'',location.pathname+location.search)}open.addEventListener('click',e=>{e.preventDefault();show(0);overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.classList.add('deck-open-body')});overlay.querySelector('.deck-close').addEventListener('click',close);overlay.querySelector('.deck-back').addEventListener('click',()=>show(idx-1));overlay.querySelector('.deck-forward').addEventListener('click',()=>show(idx+1));document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1)});})();
</script></body></html>
